# 合并数据集配置：self-made(红黑) + woodscape rgbLabels(黑绿蓝红)
# 统一二元标签: 脏污=1, 干净=0, 背景=ignore
#
# self-made:  红(255,0,0)→1, 黑(0,0,0)→0
# woodscape:  绿(0,255,0)→0, 蓝(0,0,255)→1, 红(255,0,0)→1, 黑(0,0,0)→ignore
#
# 总数据量: 212 + 5000 = 5212 张

datasets:
  - name: self-made
    image_dir: "data/20260723/self-made/iamges"
    mask_dir: "data/20260723/self-made/mask"
    mask_type: red_black       # 红=脏污, 黑=干净
  - name: woodscape
    image_dir: "data/20260723/woodscape/rgbImages"
    mask_dir: "data/20260723/woodscape/rgbLabels"
    mask_type: rgb_4color      # 绿=干净, 蓝/红=脏污, 黑=bg

experiment: "Combined_mobilenetv3"

img_size: 224
smooth_sigma: 0.6         # tile标签边界平滑 (默认0.6)
grid_size: 8
tile_threshold: 0.1
train_split: 0.8
num_workers: 4
batch_size: 32
seed: 42
