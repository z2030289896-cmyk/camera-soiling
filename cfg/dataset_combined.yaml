# ============================================================
# 合并数据集配置: self-made + WoodScape (Combined_smooth0 实验)
# ============================================================
# 统一二元标签: 异常=1, 干净=0, 背景=ignore
#
# 子数据集mask格式:
#   self-made:              红(255,0,0)→1, 黑(0,0,0)→0
#   woodscape rgbLabels:    绿(0,255,0)→忽略, 蓝/红→1, 黑(0,0,0)→0
# 总数据量: 218 + 5000 = 5218 张

# --- 子数据集列表 ---
datasets:
  - name: self-made                    # 子集1: 红黑二值mask
    image_dir: "data/20260729/self-made/iamges"
    mask_dir: "data/20260729/self-made/mask"
    mask_type: red_black               # 解析方式: 红→异常, 黑→干净
  - name: woodscape                    # 子集2: RGB四色mask
    image_dir: "data/20260729/woodscape/rgbImages"
    mask_dir: "data/20260729/woodscape/rgbLabels"
    mask_type: rgb_4color              # 解析方式: 绿→忽略, 蓝/红→异常, 黑→干净

# --- 实验归档名 ---
experiment: "Combined_smooth0"

# --- 损失函数 (SmoothL1 : BCE) ---
bce_weight: 0.5                        # BCE 权重 (实验确认0.5最优)

# --- 图像预处理 ---
img_size: 224              # 输入尺寸: 所有图片resize到 224×224

# --- Tile标签生成 ---
smooth_sigma: 0            # 边界平滑度: 0=不平滑(最优), 0.3=轻度, 0.6=默认
grid_size: 8               # 网格大小: 划分为 8×8=64 个tile
tile_threshold: 0.1        # 二值化阈值: 仅 binary=True 时使用

# --- 训练/验证划分 ---
train_split: 0.8           # 训练集比例: 80%训练, 20%验证
batch_size: 32             # 每批加载图片数
num_workers: 4             # 数据加载线程数
seed: 42                   # 随机种子: 保证划分可复现
