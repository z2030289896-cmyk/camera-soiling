# ============================================================
# TiledSoilingNet 模型结构配置 (ResNet18 截断到 layer3)

# ============================================================

# --- Parameters ---
grid_size: 8               # tile 网格大小 (8×8=64 tiles)

# --- Backbone: ResNet18 (截断到 layer3) ---
# 输入: (B, 3, 224, 224)
backbone:
  name: "resnet18"          # torchvision 模型名
  pretrained: true          # 加载 ImageNet 预训练权重
  out_channels: 256         # layer3 输出通道数
  out_spatial: [14, 14]     # 224÷16=14

  # 逐层结构 (YOLO 格式, 仅文档参考)
  # 格式: [from, repeats, module, args]
  # layer4 不使用，注释掉以保留空间分辨率用于 tile 定位
  layers:
    # layer0: → (B,64,112,112) → (B,64,56,56)
    - [-1, 1, Conv2d, [3, 64, 7, 2, 3]]          # conv1  k=7 s=2 p=3
    - [-1, 1, BatchNorm2d, [64]]
    - [-1, 1, ReLU, []]
    - [-1, 1, MaxPool2d, [3, 2, 1]]               # k=3 s=2 p=1

    # layer1: → (B,64,56,56)
    - [-1, 2, BasicBlock, [64, 64, 1]]            # in=64 out=64 s=1 ×2

    # layer2: → (B,128,28,28)
    - [-1, 2, BasicBlock, [64, 128, 2]]           # in=64 out=128 s=2 ×2

    # layer3: → (B,256,14,14)  ← 截断点
    - [-1, 2, BasicBlock, [128, 256, 2]]          # in=128 out=256 s=2 ×2

    # layer4: 未使用 (会下采样到 7×7，丢失空间分辨率)
    # - [-1, 2, BasicBlock, [256, 512, 2]]

# --- Head: TileHead ---
# 输入: (B, 256, 14, 14)
tile_head:
  in_channels: 256          # = backbone.out_channels
  grid_size: 8

  layers:
    - [-1, 1, Conv_BN_ReLU, [256, 256, 3, 1, 1]]   # refine
    - [-1, 1, Conv_BN_ReLU, [256, 128, 3, 1, 1]]   # refine
    - [-1, 1, AdaptiveAvgPool2d, [128, 8, 8]]        # spatial pool
    - [-1, 1, Conv2d, [128, 1, 1, 1, 0]]            # tile_cls

# --- 输出 ---
# tile_logits: (B, 8, 8)   — 每格 raw logits
# tile_prob:   (B, 8, 8)   — sigmoid(tile_logits) ∈ [0,1]
# coverage:    (B,)         — mean(tile_prob)
